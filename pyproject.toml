[project]
name = "modular-c2-lab"
version = "0.1.0rc1"
description = "Isolated educational mock-agent laboratory"
requires-python = ">=3.12.14,<3.13"
dependencies = []

[dependency-groups]
dev = ["ruff==0.16.10"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
